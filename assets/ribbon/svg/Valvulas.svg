  <polygon points="54,24 32,38 54,52" fill="url(#gradValvula)" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bonete Central -->
  <circle cx="32" cy="38" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="32" cy="38" r="3" fill="#38bdf8"/>
  <!-- Bridas de conexión -->
  <rect x="6" y="22" width="4" height="32" rx="2" fill="#64748b"/>
  <rect x="54" y="22" width="4" height="32" rx="2" fill="#64748b"/>
</svg>
