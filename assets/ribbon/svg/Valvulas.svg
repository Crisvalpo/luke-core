<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradValvula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradAccionador" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Volante / Accionador -->
  <rect x="22" y="8" width="20" height="6" rx="3" fill="url(#gradAccionador)"/>
  <rect x="29" y="14" width="6" height="12" fill="#94a3b8"/>
  <!-- Cuerpo de Válvula Piping (Triángulos contrapuestos) -->
