<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Acceso Rápido — LukeAPPs</title>

<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f6f8; padding: 40px 10px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width: 540px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
          <tr>
            <td style="background-color: #0f172a; padding: 28px 32px;">
              <div style="display: inline-block; background-color: #10b981; color: #ffffff; font-weight: bold; font-size: 18px; width: 36px; height: 36px; line-height: 36px; text-align: center; border-radius: 8px;">L</div>
              <span style="font-size: 20px; font-weight: 700; color: #ffffff; margin-left: 12px; vertical-align: middle;">LukeAPPs</span>
            </td>
          </tr>
          <tr>
            <td style="padding: 36px 32px 28px 32px;">
              <h1 style="font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 16px 0;">Iniciar sesión sin contraseña</h1>
              <p style="font-size: 15px; line-height: 24px; color: #475569; margin: 0 0 24px 0;">
                Haz clic en el siguiente enlace para acceder directamente a tu entorno en LukeAPPs:
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin: 30px 0;">
                <tr>
                  <td align="center" style="border-radius: 8px; background-color: #10b981;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; padding: 14px 28px; font-size: 15px; font-weight: 600; color: #ffffff; text-decoration: none; border-radius: 8px; background-color: #10b981;">
                      Ingresar a LukeAPPs &rarr;
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color: #f8fafc; padding: 20px 32px; border-top: 1px solid #e2e8f0; text-align: center;">
              <p style="font-size: 12px; color: #94a3b8; margin: 0;">LukeAPPs • Infraestructura Segura 24/7</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
