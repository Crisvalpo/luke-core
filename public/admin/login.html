<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro — Luke Core</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if (localStorage.getItem('luke_core_token')) {
      window.location.replace('/admin/index.html');
    }
  </script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-app);
      min-height: 100vh;
      padding: 1rem;
    }
    .login-card {
      background: var(--bg-container);
      border: 1px solid var(--border-container);
      border-radius: var(--border-radius-base);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo" style="width: 42px; height: 42px; font-size: 1.3rem;">L</div>
      <div>
        <h1 style="font-size: 1.25rem; font-weight: 700; color: var(--color-text);">Luke Core</h1>
        <span style="font-size: 0.8rem; color: var(--color-text-muted);">Backbone Organizacional</span>
      </div>
    </div>

    <div>
      <h2 style="font-size: 1.1rem; font-weight: 600; color: var(--color-text);">Iniciar Sesión</h2>
      <p style="font-size: 0.825rem; color: var(--color-text-muted); margin-top: 0.25rem;">
        Panel de Administración Multi-Tenant y Gestión de Faenas
      </p>
    </div>

    <form id="form-login" onsubmit="ejecutarLogin(event)" style="display: flex; flex-direction: column; gap: 1rem;">
      <div class="form-group">
        <label class="form-label">Email o Usuario</label>
        <input class="form-input" type="text" id="login-user" required placeholder="admin@lukeapp.cl" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña o API Key</label>
        <input class="form-input" type="password" id="login-pass" required placeholder="••••••••••••" autocomplete="current-password">
      </div>

      <div id="login-error" style="display: none; background: #fee2e2; border: 1px solid #fca5a5; color: #c21a25; padding: 0.65rem; border-radius: 6px; font-size: 0.8rem; text-align: center;">
      </div>

      <button type="submit" class="btn btn-primary" id="btn-login" style="padding: 0.75rem; margin-top: 0.5rem; justify-content: center;">
        Ingresar al Panel
      </button>
    </form>

    <div style="text-align: center; font-size: 0.75rem; color: var(--color-text-muted); border-top: 1px solid var(--border-container); padding-top: 1rem;">
      <span>Protegido por Supabase Auth & HMAC Token • Oracle Cloud</span>
    </div>
  </div>

  <script>
    // Si ya existe sesión válida, redirige al panel
    if (localStorage.getItem('luke_core_token')) {
      window.location.href = '/admin/index.html';
    }

    async function ejecutarLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-login');
      const errBox = document.getElementById('login-error');
      
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Verificando...';

      const payload = {
        identificador: document.getElementById('login-user').value.trim(),
        password: document.getElementById('login-pass').value
      };

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Credenciales inválidas');

        // Guardar token y datos del usuario
        localStorage.setItem('luke_core_token', json.data.access_token || json.data.token);
        localStorage.setItem('luke_core_user', JSON.stringify(json.data));

        window.location.href = '/admin/index.html';

      } catch (error) {
        errBox.innerText = `❌ ${error.message}`;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Ingresar al Panel';
      }
    }
  </script>
</body>
</html>
